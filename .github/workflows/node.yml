name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installera beroenden
        run: npm ci

      - name: Syntaxkontrollera backend och frontend-skript
        run: |
          node --check server.js
          for f in src/*.js; do node --check "$f"; done

      - name: Kör testsviten
        run: npm test
